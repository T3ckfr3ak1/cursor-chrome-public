<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor-Chrome Live</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a1018;
        --bg-deep: #060a10;
        --line: #3a4d63;
        --text: #e6eef6;
        --muted: #8fa3b8;
        --steel-base:
          radial-gradient(1000px 560px at 15% -10%, rgba(70, 120, 180, 0.22), transparent 55%),
          linear-gradient(165deg, #141e2c 0%, #0c141e 42%, #0a1018 100%);
        --steel-brush:
          repeating-linear-gradient(
            98deg,
            transparent 0 1px,
            rgba(160, 200, 255, 0.02) 1px 2px,
            transparent 2px 5px
          );
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--steel-brush), var(--steel-base);
        color: var(--text);
        font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(170, 210, 255, 0.08), transparent 55%),
          linear-gradient(180deg, #1a2736, #101820);
      }
      .bar h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .bar .meta { color: var(--muted); font-size: 12px; }
      .stage {
        height: calc(100% - 46px);
        display: grid;
        place-items: center;
        padding: 12px;
        background:
          radial-gradient(800px 400px at 50% 0%, rgba(60, 110, 180, 0.14) 0%, transparent 60%),
          var(--bg-deep);
      }
      img#live {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #000;
        box-shadow: 0 8px 28px rgba(0, 12, 30, 0.55);
      }
      select, button {
        background:
          linear-gradient(180deg, rgba(170, 210, 255, 0.1), transparent 55%),
          linear-gradient(180deg, #243246, #121c28);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
      }
      .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div class="bar">
      <div>
        <h1>Cursor-Chrome · Live view</h1>
        <div class="meta" id="meta">Connecting…</div>
      </div>
      <div class="controls">
        <select id="tabSelect"></select>
        <button type="button" id="btnRefresh">Refresh tabs</button>
      </div>
    </div>
    <div class="stage">
      <img id="live" alt="Live tab stream" />
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      let tabId = params.get('tab') || location.pathname.split('/').pop();
      if (tabId === 'live' || tabId === 'live.html') tabId = '';

      const img = document.getElementById('live');
      const meta = document.getElementById('meta');
      const tabSelect = document.getElementById('tabSelect');
      const btnRefresh = document.getElementById('btnRefresh');
      let frames = 0;
      let last = 0;

      function setStream(id) {
        tabId = id;
        frames = 0;
        last = Date.now();
        const url = `/tabs/${encodeURIComponent(id)}/mjpeg?t=${Date.now()}`;
        img.src = url;
        history.replaceState(null, '', `/live?tab=${encodeURIComponent(id)}`);
        meta.textContent = `Streaming ${id.slice(0, 8)}… · realtime MJPEG`;
      }

      async function loadTabs() {
        const res = await fetch('/tabs');
        const data = await res.json();
        tabSelect.innerHTML = '';
        for (const t of data.tabs || []) {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = `${t.title || 'Tab'} — ${(t.url || '').slice(0, 48)}`;
          tabSelect.appendChild(opt);
        }
        if (!tabId && data.tabs?.[0]) tabId = data.tabs[0].id;
        if (tabId) {
          tabSelect.value = tabId;
          setStream(tabId);
        } else {
          meta.textContent = 'No tabs yet — claim one from Cursor first.';
        }
      }

      tabSelect.addEventListener('change', () => setStream(tabSelect.value));
      btnRefresh.addEventListener('click', loadTabs);
      img.addEventListener('load', () => {
        frames += 1;
        const now = Date.now();
        if (now - last > 1000) {
          meta.textContent = `Live · ${tabId.slice(0, 8)} · ~${frames} fps window`;
          frames = 0;
          last = now;
        }
      });

      loadTabs();
    </script>
  </body>
</html>
